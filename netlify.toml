[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/flux"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/rain-onboarding"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/coins-onboarding"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/coins-learning-strategy"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    
[[headers]]
  for = "/coins-lms"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/trunk-tools-track"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/the-score"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/ai-fluency"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/"
  to = "/index"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
